<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold (सुन) Estimate Calculator</title>
  <style>
    :root {
      --primary: #d4af37;
      --background: #f8f9fa;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      margin: 0;
    }

    .calculator-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 650px; /* Made wider here */
      padding: 24px 16px;
      border-top: 5px solid var(--primary);
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      color: #8a6d1c;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      display: grid;
      grid-template-columns: 2.2fr 1fr 1.5fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-group.single-input {
      grid-template-columns: 3.2fr 1.5fr;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
    }

    input, select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    input[readonly] {
      background-color: #f1f3f5;
      font-weight: 600;
    }

    .divider {
      border-top: 1px dashed var(--border);
      margin: 16px 0;
    }

    .highlight-row input {
      background-color: #fff9e6;
      color: #8a6d1c;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h2>Gold Estimate Calculator</h2>
    <form id="goldForm">

      <!-- Weight & Karat -->
      <div class="form-group">
        <label for="weight">Weight (तौल)</label>
        <select id="karat" onchange="calculate()">
          <option value="24K">24K</option>
          <option value="23K">23K</option>
          <option value="22K" selected>22K</option>
          <option value="18K">18K</option>
          <option value="14K">14K</option>
        </select>
        <input type="number" id="weight" step="0.001" value="8" oninput="calculate()">
      </div>

      <!-- Jarti % -->
      <div class="form-group">
        <label for="jartiPct">Jarti% (जर्ती %)</label>
        <input type="number" id="jartiPct" step="0.1" value="15" oninput="calculate()">
        <input type="number" id="jartiPctVal" readonly>
      </div>

      <!-- Jarti Per Item -->
      <div class="form-group single-input">
        <label for="jartiItem">Jarti per Item (जर्ती प्रति थान)</label>
        <input type="number" id="jartiItem" step="0.001" value="0" oninput="calculate()">
      </div>

      <!-- Total Weight -->
      <div class="form-group single-input">
        <label for="totalWeight">Total weight (जम्मा तौल)</label>
        <input type="number" id="totalWeight" readonly>
      </div>

      <!-- Tama Mix -->
      <div class="form-group">
        <label for="tamaVal">TAMA MIX (तामा मिश्रण)</label>
        <input type="number" id="tamaPct" readonly>
        <input type="number" id="tamaVal" readonly>
      </div>

      <!-- Pure Gold -->
      <div class="form-group single-input">
        <label for="pureGold">PURE GOLD (24K)</label>
        <input type="number" id="pureGold" readonly>
      </div>

      <!-- Gold Given -->
      <div class="form-group single-input">
        <label for="goldGiven">Gold Given (सुन दिएको)</label>
        <input type="number" id="goldGiven" step="0.001" value="0" oninput="calculate()">
      </div>

      <!-- Net Gold -->
      <div class="form-group single-input">
        <label for="totalGoldNet">Total Gold (जम्मा सुन)</label>
        <input type="number" id="totalGoldNet" readonly>
      </div>

      <div class="divider"></div>

      <!-- Rate -->
      <div class="form-group single-input">
        <label for="rate">Rate (दर)</label>
        <input type="number" id="rate" value="298000" oninput="calculate()">
      </div>

      <!-- Gold Amount -->
      <div class="form-group single-input">
        <label for="goldAmount">Gold Amount (सुन रकम)</label>
        <input type="number" id="goldAmount" readonly>
      </div>

      <!-- Jyala -->
      <div class="form-group single-input">
        <label for="jyala">Jyala (ज्याला)</label>
        <input type="number" id="jyala" value="3000" oninput="calculate()">
      </div>

      <!-- Total Amount -->
      <div class="form-group single-input">
        <label for="totalAmount">Total Amount (जम्मा रकम)</label>
        <input type="number" id="totalAmount" readonly>
      </div>

      <!-- Discount -->
      <div class="form-group single-input">
        <label for="discount">Discount (छुट)</label>
        <input type="number" id="discount" value="0" oninput="calculate()">
      </div>

      <!-- Amount After Discount -->
      <div class="form-group single-input">
        <label for="discountedAmount">Amt. with Discount</label>
        <input type="number" id="discountedAmount" readonly>
      </div>

      <!-- Tax -->
      <div class="form-group">
        <label for="taxVal">Tax (कर)</label>
        <input type="number" id="taxPct" step="0.01" value="0.5" oninput="calculate()">
        <input type="number" id="taxVal" readonly>
      </div>

      <!-- Grand Total -->
      <div class="form-group single-input highlight-row">
        <label for="grandTotal">TOTAL AMOUNT</label>
        <input type="number" id="grandTotal" readonly>
      </div>

      <div class="divider"></div>

      <!-- Advance -->
      <div class="form-group single-input">
        <label for="advance">ADVANCE AMOUNT</label>
        <input type="number" id="advance" value="0" oninput="calculate()">
      </div>

      <!-- Remaining -->
      <div class="form-group single-input highlight-row">
        <label for="remaining">REMAINING AMOUNT</label>
        <input type="number" id="remaining" readonly>
      </div>

    </form>
  </div>

  <script>
    function getTamaPercent(karat) {
      const rates = {
        "24K": 0.00,
        "23K": 0.03,
        "22K": 0.07,
        "18K": 0.25,
        "14K": 0.415
      };
      return rates[karat] || 0.00;
    }

    function calculate() {
      // 1. Get Inputs
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const karat = document.getElementById('karat').value;
      const jartiPct = parseFloat(document.getElementById('jartiPct').value) || 0;
      const jartiItem = parseFloat(document.getElementById('jartiItem').value) || 0;
      const goldGiven = parseFloat(document.getElementById('goldGiven').value) || 0;
      const rate = parseFloat(document.getElementById('rate').value) || 0;
      const jyala = parseFloat(document.getElementById('jyala').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const taxPct = parseFloat(document.getElementById('taxPct').value) || 0;
      const advance = parseFloat(document.getElementById('advance').value) || 0;

      // 2. Calculations
      const jartiPctVal = weight * (jartiPct / 100);
      const totalWeight = weight + jartiPctVal + jartiItem;

      const tamaPct = getTamaPercent(karat);
      const tamaVal = totalWeight * tamaPct;
      const pureGold = totalWeight - tamaVal;

      const totalGoldNet = pureGold - goldGiven;
      
      const goldAmount = totalGoldNet * rate;
      const totalAmount = goldAmount + jyala;
      
      const discountedAmount = totalAmount - discount;
      const taxVal = discountedAmount * (taxPct / 100);

      const grandTotal = discountedAmount + taxVal;
      const remaining = grandTotal - advance;

      // 3. Render Outputs
      document.getElementById('jartiPctVal').value = jartiPctVal.toFixed(3);
      document.getElementById('totalWeight').value = totalWeight.toFixed(3);
      document.getElementById('tamaPct').value = tamaPct;
      document.getElementById('tamaVal').value = tamaVal.toFixed(3);
      document.getElementById('pureGold').value = pureGold.toFixed(3);
      document.getElementById('totalGoldNet').value = totalGoldNet.toFixed(3);

      document.getElementById('goldAmount').value = goldAmount.toFixed(2);
      document.getElementById('totalAmount').value = totalAmount.toFixed(2);
      document.getElementById('discountedAmount').value = discountedAmount.toFixed(2);
      document.getElementById('taxVal').value = taxVal.toFixed(2);
      document.getElementById('grandTotal').value = grandTotal.toFixed(2);
      document.getElementById('remaining').value = remaining.toFixed(2);
    }

    // Run on load
    window.onload = calculate;
  </script>
</body>
</html>
