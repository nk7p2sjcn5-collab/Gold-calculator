<script>
    const SHEET_ID = '1IxI6n1hJwRmSmDA8M4fIXbX0jS9N2JLJwxR8j90lBik';
    let customerMap = {};

    // Load real contacts live from Google Sheets using JSONP
    function loadCustomers() {
      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetData`;
      document.body.appendChild(script);
    }

    // Google Sheets callback function
    function handleSheetData(data) {
      try {
        const rows = data.table.rows;
        const datalist = document.getElementById('customerList');
        datalist.innerHTML = '';
        customerMap = {};

        rows.forEach(row => {
          if (!row || !row.c) return;

          // Extract values from cells
          const cells = row.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : '');

          let name = '';
          let phone = '';

          // Look for name and phone in adjacent columns
          for (let i = 0; i < cells.length; i++) {
            if (cells[i] && cells[i].toUpperCase() !== 'NAMES' && cells[i].toUpperCase() !== 'NAME') {
              if (!name) {
                name = cells[i];
              } else if (!phone) {
                phone = cells[i];
                break;
              }
            }
          }

          if (name) {
            customerMap[name.toLowerCase()] = phone;

            const opt = document.createElement('option');
            opt.value = name;
            datalist.appendChild(opt);
          }
        });
      } catch (err) {
        console.error("Failed to parse sheet data:", err);
      }
    }

    function handleCustomerSelect() {
      const inputVal = document.getElementById('customerName').value.trim().toLowerCase();
      if (customerMap[inputVal] !== undefined) {
        document.getElementById('customerPhone').value = customerMap[inputVal];
      }
    }

    function getTamaPercent(karat) {
      const rates = {
        "24K": 0.00,
        "23K": 0.03,
        "22K": 0.07,
        "18K": 0.25,
        "14K": 0.415
      };
      return rates[karat] || 0.00;
    }

    function calculate() {
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const karat = document.getElementById('karat').value;
      const jartiPct = parseFloat(document.getElementById('jartiPct').value) || 0;
      const jartiItem = parseFloat(document.getElementById('jartiItem').value) || 0;
      const goldGiven = parseFloat(document.getElementById('goldGiven').value) || 0;
      const rate = parseFloat(document.getElementById('rate').value) || 0;
      const jyala = parseFloat(document.getElementById('jyala').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const taxPct = parseFloat(document.getElementById('taxPct').value) || 0;
      const advance = parseFloat(document.getElementById('advance').value) || 0;

      const jartiPctVal = weight * (jartiPct / 100);
      const totalWeight = weight + jartiPctVal + jartiItem;

      const tamaPct = getTamaPercent(karat);
      const tamaVal = totalWeight * tamaPct;
      const pureGold = totalWeight - tamaVal;

      const totalGoldNet = pureGold - goldGiven;
      
      const goldAmount = totalGoldNet * rate;
      const totalAmount = goldAmount + jyala;
      
      const discountedAmount = totalAmount - discount;
      const taxVal = discountedAmount * (taxPct / 100);

      const grandTotal = discountedAmount + taxVal;
      const remaining = grandTotal - advance;

      document.getElementById('jartiPctVal').value = jartiPctVal.toFixed(3);
      document.getElementById('totalWeight').value = totalWeight.toFixed(3);
      document.getElementById('tamaPct').value = tamaPct;
      document.getElementById('tamaVal').value = tamaVal.toFixed(3);
      document.getElementById('pureGold').value = pureGold.toFixed(3);
      document.getElementById('totalGoldNet').value = totalGoldNet.toFixed(3);

      document.getElementById('goldAmount').value = goldAmount.toFixed(2);
      document.getElementById('totalAmount').value = totalAmount.toFixed(2);
      document.getElementById('discountedAmount').value = discountedAmount.toFixed(2);
      document.getElementById('taxVal').value = taxVal.toFixed(2);
      document.getElementById('grandTotal').value = grandTotal.toFixed(2);
      document.getElementById('remaining').value = remaining.toFixed(2);
    }

    window.onload = function() {
      calculate();
      loadCustomers();
    };
  </script>
